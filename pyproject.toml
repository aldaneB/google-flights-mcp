[project]
name = "google-flights-mcp"
version = "0.1.0"
description = "MCP server for flight planning using fast-flights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fast-flights>=2.1",
    "fastmcp>=0.5.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
google-flights-mcp = "google_flights_mcp.server:main"
